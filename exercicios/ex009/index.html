<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Trabalhando com listas</h1>
    <h2>Listas ordenadas</h2>
    <ol type="1"> <!-- e se quiser colocar e comece pelo ex 4 tem que colocar "start=4"-->
        <li>Acordar tomar um coffe
        <li>Meditação
    </ol><!--OL junto com o LI faz a lista 1,2,3,4 ja sequenciada mas não esquecer de colocar o "type=1"-->
    <h2>Listas não Ordenadas</h2>
    <ul>
        <li>Pão
        <li>Leite
        <li>Bolacha
        </li>
        <!--A "UL" serve como a lista já sugeri nao vai estar ordenas mas só para marcar mesmo-->
    </ul>

    <ol>
        <li>Açucar
        <li>Tempero
        <li>Feijão 
        <ol type="a"> <!--MISTURANDO, Letras e numeros-->

            <li>Sabonete 1.2

        <header></header>

            </li>
        </ol> <br>
    <ol type="A">
        <li>Francisco 
        <li>Hugo    

        </li>   
    
    
    </ol>

</html>
