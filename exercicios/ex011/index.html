<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
   <h1>Imagem dinâmica</h1>
   <p>Abra as imagens em dispositivos diferente</p>
   
   <!-- Picture: exibe imagens diferentes dependendo do tamanho da tela -->
<picture>

  <!-- Se a tela tiver até 750px (celular), carrega a imagem pequena -->
  <source media="(max-width: 750px)" srcset="imagens/P.png" type="image/png">

  <!-- Se a tela tiver até 1050px (tablet), carrega a imagem média -->
  <source media="(max-width: 1050px)" srcset="imagens/M.png" type="image/png">

  <!-- Imagem padrão: aparece se nenhuma condição acima for atendida (desktop) -->
  <img src="imagens/G.png" alt="imagem flexível">

  <h1>Reproduzindo Àudio</h1>
  <p>Aprendendo a reproduzir áudio no HTML5</p>
  <audio src="midia/blues.mp3" controls autoplay></audio>

</picture>
    
</body>
</html>
